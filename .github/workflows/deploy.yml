name: Deploy Iron Bat to Render

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync Gemini key to Render (via GitHub Secrets)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ] || [ -z "$GEMINI_API_KEY" ]; then
            echo "::warning::Secrets RENDER_API_KEY / RENDER_SERVICE_ID / GEMINI_API_KEY not fully set - skipping env sync."
            exit 0
          fi
          curl -sS -X PUT "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/env-vars" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "[{\"envVarKey\":\"GEMINI_API_KEY\",\"value\":\"${GEMINI_API_KEY}\"}]"

      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL secret missing - add it and re-run."
            exit 1
          fi
          curl -sS -X POST "$RENDER_DEPLOY_HOOK_URL"
